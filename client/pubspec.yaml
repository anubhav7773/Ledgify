name: ledgify
description: "AI-Autonomous TallyPrime clone for Indian MSMEs."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Identity & Authentication
  firebase_core: ^2.30.0
  firebase_auth: ^4.19.4
  google_sign_in: ^6.2.1

  # Backend & Database
  supabase_flutter: ^2.5.6

  # Monetization & Ads
  in_app_purchase: ^3.2.0
  in_app_purchase_android: ^0.3.3
  google_mobile_ads: ^5.0.0

  # UI / UX, Icons & Vernacular Fonts
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0

  # Hardware, Media & Audio Capture
  camera: ^0.10.6
  record: ^5.1.2
  path_provider: ^2.1.3
  image_picker: ^1.1.1
  file_picker: ^8.0.3

  # Network & Utilities
  http: ^1.2.1
  flutter_dotenv: ^5.1.0
  uuid: ^4.4.0
  qr_flutter: ^4.1.0
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/icons/
    - .env

  fonts:
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansDevanagari-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700
