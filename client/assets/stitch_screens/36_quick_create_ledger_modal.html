<script>
    document.addEventListener('DOMContentLoaded', () => {
        const sheet = document.getElementById('bottom-sheet');
        const backdrop = document.getElementById('backdrop');
        const closeBtn = document.getElementById('close-btn');
        const gstinInput = document.getElementById('gstin');
        const gstinBadge = document.getElementById('gstin-badge');
        
        // Initial animation state
        sheet.style.transform = 'translateY(100%)';
        backdrop.style.opacity = '0';
        
        // Open animation (simulate mounting)
        requestAnimationFrame(() => {
            sheet.style.transform = 'translateY(0)';
            backdrop.style.opacity = '1';
        });

        const closeModal = () => {
            sheet.style.transform = 'translateY(100%)';
            backdrop.style.opacity = '0';
            setTimeout(() => {
               // In a real app, this would remove the element from DOM
               console.log('Modal closed');
            }, 300);
        };

        closeBtn.addEventListener('click', closeModal);
        backdrop.addEventListener('click', closeModal);

        // Simple GSTIN validation simulation
        gstinInput.addEventListener('input', (e) => {
            const val = e.target.value.trim();
            if (val.length === 15) { // Basic length check for simulation
                gstinBadge.classList.remove('hidden');
                gstinBadge.classList.add('flex');
            } else {
                gstinBadge.classList.add('hidden');
                gstinBadge.classList.remove('flex');
            }
        });

        // Form submission prevent
        document.getElementById('ledger-form').addEventListener('submit', (e) => {
            e.preventDefault();
            // Trigger saving state then close
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span>';
            
            setTimeout(() => {
                btn.innerHTML = originalContent;
                closeModal();
            }, 800);
        });
    });
