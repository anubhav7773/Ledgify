<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Roboto+Mono:wght@500;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface-container": "#e7eeff", "outline-variant": "#c5c5d3", "on-secondary-fixed-variant": "#005320", "surface-container-low": "#f0f3ff", "on-surface": "#111c2d", "surface-container-high": "#dee8ff", "primary": "#00236f", "background": "#f9f9ff", "on-surface-variant": "#444651", "surface": "#f9f9ff" }, "spacing": { "gutter-mobile": "12px", "xs": "4px", "base": "4px", "touch-target": "48px", "margin-mobile": "16px", "lg": "24px", "xl": "32px", "sm": "8px", "md": "16px" }, "fontFamily": { "headline-md": ["Inter"], "body-lg": ["Inter"], "label-caps": ["Inter"] }, "fontSize": { "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }] } } } };</script><style>@layer base { .pt-safe { padding-top: env(safe-area-inset-top); } .pb-safe { padding-bottom: env(safe-area-inset-bottom); } }</style><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-background text-on-surface font-body-lg"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl pt-safe"><div class="h-16 flex items-center px-margin-mobile gap-md"><button class="w-10 h-10 flex items-center justify-center rounded-full active:bg-surface-container" onclick="history.back()"><span class="material-symbols-outlined">arrow_back</span></button><h1 class="font-headline-md text-headline-md">Voice Entry Flow</h1></div></header><main class="relative w-full pt-16 bg-background min-h-screen"><div class="flex flex-col w-full pb-[80px]">
<!-- Basic Details -->
<section class="p-4 flex flex-col gap-4">
<h2 class="text-on-surface-variant font-label-caps uppercase tracking-wider mb-2">Basic Details</h2>
<div class="bg-surface-container-lowest shadow-sm rounded-lg flex flex-col p-4 gap-4">
<!-- Ledger Name -->
<div class="flex flex-col gap-1 relative">
<label class="text-on-surface-variant font-label-caps absolute top-2 left-3 bg-surface-container-lowest px-1 z-10" for="ledgerName" style="transform: translateY(-50%);">Ledger Name</label>
<input class="h-12 w-full rounded-lg px-3 pt-2 text-on-surface font-body-lg bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary shadow-[0_0_0_1px_#E2E8F0_inset]" id="ledgerName" type="text" value="Gupta Hardware &amp; Tools"/>
</div>
<!-- Group Dropdown -->
<div class="flex flex-col gap-1 relative mt-2">
<label class="text-on-surface-variant font-label-caps absolute top-2 left-3 bg-surface-container-lowest px-1 z-10" for="ledgerGroup" style="transform: translateY(-50%);">Group</label>
<div class="relative w-full">
<select class="appearance-none h-12 w-full rounded-lg px-3 pt-2 text-on-surface font-body-lg bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary shadow-[0_0_0_1px_#E2E8F0_inset]" id="ledgerGroup">
<option>Sundry Debtors / Customers</option>
<option>Sundry Creditors / Suppliers</option>
<option>Bank Accounts</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">arrow_drop_down</span>
</div>
</div>
</div>
</section>
<!-- Statutory & GST Info -->
<section class="p-4 flex flex-col gap-4 pt-0">
<h2 class="text-on-surface-variant font-label-caps uppercase tracking-wider mb-2">Statutory &amp; GST Info</h2>
<div class="bg-surface-container-lowest shadow-sm rounded-lg flex flex-col p-4 gap-4">
<!-- GSTIN -->
<div class="flex flex-col gap-1 relative">
<label class="text-on-surface-variant font-label-caps absolute top-2 left-3 bg-surface-container-lowest px-1 z-10" for="gstin" style="transform: translateY(-50%);">GSTIN</label>
<div class="relative w-full flex">
<input class="h-12 w-full rounded-l-lg pl-3 pr-24 pt-2 text-on-surface font-data-md uppercase bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary shadow-[0_0_0_1px_#E2E8F0_inset]" id="gstin" placeholder="Enter 15-digit GSTIN" type="text"/>
<button class="absolute right-1 top-1 bottom-1 px-3 bg-primary-container text-on-primary-container font-label-caps rounded-md active:bg-primary active:text-on-primary transition-colors flex items-center justify-center">Auto-Fetch</button>
</div>
</div>
<!-- State -->
<div class="flex flex-col gap-1 relative mt-2">
<label class="text-on-surface-variant font-label-caps absolute top-2 left-3 bg-surface-container-lowest px-1 z-10" for="state" style="transform: translateY(-50%);">State &amp; Place of Supply</label>
<div class="relative w-full">
<select class="appearance-none h-12 w-full rounded-lg px-3 pt-2 text-on-surface font-body-lg bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary shadow-[0_0_0_1px_#E2E8F0_inset]" id="state">
<option>07 - Delhi</option>
<option>27 - Maharashtra</option>
<option>29 - Karnataka</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">arrow_drop_down</span>
</div>
</div>
<!-- PAN -->
<div class="flex flex-col gap-1 relative mt-2">
<label class="text-on-surface-variant font-label-caps absolute top-2 left-3 bg-surface-container-lowest px-1 z-10" for="pan" style="transform: translateY(-50%);">PAN</label>
<input class="h-12 w-full rounded-lg px-3 pt-2 text-on-surface font-data-md uppercase bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary shadow-[0_0_0_1px_#E2E8F0_inset]" id="pan" placeholder="ABCDE1234F" type="text"/>
</div>
</div>
</section>
<!-- Credit Terms -->
<section class="p-4 flex flex-col gap-4 pt-0">
<h2 class="text-on-surface-variant font-label-caps uppercase tracking-wider mb-2">Credit Terms</h2>
<div class="bg-surface-container-lowest shadow-sm rounded-lg flex flex-col p-4 gap-4">
<div class="flex gap-4">
<!-- Credit Period -->
<div class="flex flex-col gap-1 relative flex-1">
<label class="text-on-surface-variant font-label-caps absolute top-2 left-3 bg-surface-container-lowest px-1 z-10" for="creditPeriod" style="transform: translateY(-50%);">Credit Period (days)</label>
<input class="h-12 w-full rounded-lg px-3 pt-2 text-on-surface font-data-md bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary shadow-[0_0_0_1px_#E2E8F0_inset]" id="creditPeriod" placeholder="30" type="number"/>
</div>
<!-- Credit Limit -->
<div class="flex flex-col gap-1 relative flex-1">
<label class="text-on-surface-variant font-label-caps absolute top-2 left-3 bg-surface-container-lowest px-1 z-10" for="creditLimit" style="transform: translateY(-50%);">Credit Limit (₹)</label>
<input class="h-12 w-full rounded-lg px-3 pt-2 text-on-surface font-data-md text-right bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary shadow-[0_0_0_1px_#E2E8F0_inset]" id="creditLimit" placeholder="100000" type="number"/>
</div>
</div>
</div>
</section>
<!-- Bank & Contact -->
<section class="p-4 flex flex-col gap-4 pt-0">
<h2 class="text-on-surface-variant font-label-caps uppercase tracking-wider mb-2">Bank &amp; Contact</h2>
<div class="bg-surface-container-lowest shadow-sm rounded-lg flex flex-col p-4 gap-4">
<!-- Account Number -->
<div class="flex flex-col gap-1 relative">
<label class="text-on-surface-variant font-label-caps absolute top-2 left-3 bg-surface-container-lowest px-1 z-10" for="accNo" style="transform: translateY(-50%);">Account Number</label>
<input class="h-12 w-full rounded-lg px-3 pt-2 text-on-surface font-data-md bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary shadow-[0_0_0_1px_#E2E8F0_inset]" id="accNo" placeholder="xxxx xxxx 4532" type="number"/>
</div>
<!-- IFSC -->
<div class="flex flex-col gap-1 relative mt-2">
<label class="text-on-surface-variant font-label-caps absolute top-2 left-3 bg-surface-container-lowest px-1 z-10" for="ifsc" style="transform: translateY(-50%);">IFSC</label>
<input class="h-12 w-full rounded-lg px-3 pt-2 text-on-surface font-data-md uppercase bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary shadow-[0_0_0_1px_#E2E8F0_inset]" id="ifsc" placeholder="HDFC0001234" type="text"/>
</div>
<!-- Mobile Number -->
<div class="flex flex-col gap-1 relative mt-2">
<label class="text-on-surface-variant font-label-caps absolute top-2 left-3 bg-surface-container-lowest px-1 z-10" for="mobile" style="transform: translateY(-50%);">Mobile Number</label>
<div class="relative w-full flex items-center shadow-[0_0_0_1px_#E2E8F0_inset] rounded-lg focus-within:ring-2 focus-within:ring-primary bg-surface-container-lowest h-12">
<span class="pl-3 text-on-surface-variant font-body-lg">+91</span>
<input class="h-full w-full rounded-r-lg px-2 pt-2 text-on-surface font-data-md bg-transparent focus:outline-none" id="mobile" placeholder="9876543210" type="tel"/>
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-1 relative mt-2">
<label class="text-on-surface-variant font-label-caps absolute top-2 left-3 bg-surface-container-lowest px-1 z-10" for="email" style="transform: translateY(-50%);">Email</label>
<input class="h-12 w-full rounded-lg px-3 pt-2 text-on-surface font-body-lg bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary shadow-[0_0_0_1px_#E2E8F0_inset]" id="email" placeholder="contact@guptahardware.com" type="email"/>
</div>
</div>
</section>
<!-- Bottom Action Bar -->
<div class="fixed bottom-0 left-0 right-0 p-4 bg-surface-container-lowest/90 backdrop-blur shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] pb-safe z-40">
<button class="w-full h-[48px] bg-primary text-on-primary rounded-lg font-body-lg font-medium flex items-center justify-center gap-2 active:bg-primary-container active:text-on-primary-container transition-colors shadow-sm">
<span class="material-symbols-outlined text-[20px]">save</span>
      Save Ledger
    </button>
</div>
</div>
<script>
    // Simple micro-interaction for the Auto-fetch button
    document.querySelector('button').addEventListener('click', function(e) {
        if(this.textContent === 'Auto-Fetch') {
             const originalText = this.textContent;
             this.innerHTML = '<span class="material-symbols-outlined animate-spin text-[16px]">sync</span>';
             
             setTimeout(() => {
                 this.innerHTML = '<span class="material-symbols-outlined text-[16px]">check</span> Fetched';
                 this.classList.replace('bg-primary-container', 'bg-secondary-container');
                 this.classList.replace('text-on-primary-container', 'text-on-secondary-container');
                 
                 // Fill dummy data
                 document.getElementById('pan').value = '27AADCB2230M1Z3'.substring(2,12);
                 document.getElementById('state').value = '27 - Maharashtra';
                 document.getElementById('gstin').value = '27AADCB2230M1Z3';

                 setTimeout(() => {
                    this.textContent = originalText;
                    this.classList.replace('bg-secondary-container', 'bg-primary-container');
                    this.classList.replace('text-on-secondary-container', 'text-on-primary-container');
                 }, 2000);
             }, 800);
        }
    });
</script></main></body></html>
