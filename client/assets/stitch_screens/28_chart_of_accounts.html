<script>
  function toggleTree(btn) {
    const icon = btn.querySelector('[data-icon="chevron"]');
    const container = btn.nextElementSibling;
    const isExpanded = icon.classList.contains('rotate-90');
    
    if (isExpanded) {
      icon.classList.remove('rotate-90');
      icon.classList.remove('text-primary');
      icon.classList.add('text-primary/50');
      
      // Store actual height before collapsing
      container.style.height = container.scrollHeight + 'px';
      
      // Force reflow
      container.offsetHeight;
      
      container.style.height = '0px';
      container.style.opacity = '0';
    } else {
      icon.classList.add('rotate-90');
      icon.classList.add('text-primary');
      icon.classList.remove('text-primary/50');
      
      container.style.height = container.scrollHeight + 'px';
      container.style.opacity = '1';
      
      // Remove fixed height after transition so it can grow if children expand
      setTimeout(() => {
        if(icon.classList.contains('rotate-90')) {
            container.style.height = 'auto';
        }
      }, 300);
    }
  }
