# Supabase configuration file for Ledgify

project_id = "ledgify"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322

[auth]
enabled = true
site_url = "http://localhost:3000"
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
enable_confirmations = false

[auth.third_party.firebase]
enabled = true
project_id = "ledgify-prod"
