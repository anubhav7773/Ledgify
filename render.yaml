services:
  - type: web
    name: ledgify-fastapi-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: SUPABASE_URL
        value: https://bbkftnptmxjpbusjpqbg.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_PLAY_PACKAGE_NAME
        value: com.asiverticals.ledgify
